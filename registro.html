<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta — LIMPIARTE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="logo"><span class="logo-marca">🧽</span> LIMPIARTE</a>
    <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-menu">
      <a href="index.html#inicio">Inicio</a>
      <a href="index.html#productos">Productos</a>
      <a href="index.html#nosotros">Nosotros</a>
      <a href="index.html#contacto">Contacto</a>
      <div class="nav-sesion" data-zona-sesion></div>
    </div>
  </nav>
</header>

<main class="franja-auth">
  <div class="panel-form">
    <h1>Crear cuenta</h1>
    <p class="subtitulo">Registrate para comenzar a comprar en LIMPIARTE.</p>

    <div class="mensaje-form" id="mensajeRegistro" hidden></div>

    <form id="formRegistro" novalidate>
      <div class="campo-fila">
        <div class="campo-grupo">
          <label for="regNombre">Nombre</label>
          <input class="campo-input" type="text" id="regNombre" name="nombre" required>
        </div>
        <div class="campo-grupo">
          <label for="regApellido">Apellido</label>
          <input class="campo-input" type="text" id="regApellido" name="apellido" required>
        </div>
      </div>
      <div class="campo-grupo">
        <label for="regEmail">Email</label>
        <input class="campo-input" type="email" id="regEmail" name="email" required autocomplete="email">
      </div>
      <div class="campo-grupo">
        <label for="regPassword">Contraseña</label>
        <input class="campo-input" type="password" id="regPassword" name="password" required autocomplete="new-password">
      </div>
      <div class="campo-grupo">
        <label for="regConfirmar">Confirmar contraseña</label>
        <input class="campo-input" type="password" id="regConfirmar" name="confirmarPassword" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Crear cuenta</button>
    </form>

    <p class="enlace-secundario">¿Ya tenés una cuenta? <a href="login.html">Iniciar sesión</a></p>
  </div>
</main>

<footer class="site-footer">
  <div class="contenedor footer-bottom">© 2026 LIMPIARTE. Proyecto académico — Olimpíada Nacional de Informática.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script>redirigirSiYaLogueado(); inicializarFormularioRegistro();</script>
</body>
</html>
